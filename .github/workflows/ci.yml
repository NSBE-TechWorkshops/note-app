name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: notebuddy
          POSTGRES_PASSWORD: notebuddy
          POSTGRES_DB: notebuddy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U notebuddy -d notebuddy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql://notebuddy:notebuddy@localhost:5432/notebuddy_test
      REQUIRE_DB: "1" # integration tests must run in CI, never silently skip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # matches the Docker images
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: ruff check app lambda tests
      - run: pytest -v

  lambda-deps:
    name: Lambda dependencies are complete
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Install ONLY what the Lambda image installs, so a missing package fails here and not in production
      - run: pip install -r lambda/document_processor/requirements.txt
      - name: Import the handler and the pipeline it calls
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
          LLM_API_KEY: not-a-real-key
        run: |
          PYTHONPATH=lambda/document_processor python -c "import handler; from app.services.document_processor import process_document"

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build # tsc -b && vite build

  terraform:
    name: Terraform (fmt + validate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Backend (ECS) image
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: prod
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Document processor (Lambda) image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/lambda/document_processor/Dockerfile
          push: false
          cache-from: type=gha,scope=lambda
          cache-to: type=gha,scope=lambda,mode=max

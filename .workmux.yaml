mode: session

files:
  symlink:
    - frontend/node_modules # Share node_modules across worktrees (fast, no disk copy)
  copy:
    - .env.example
    - .env

post_create:
  - cd backend && python -m venv .venv && .venv/bin/pip install -r requirements.txt

windows:
  - name: editor
    panes:
      - command: nvim
        name: nvim
        focus: true

  - name: AI
    panes:
      - command: oc
        name: OpenCode
        focus: true
      - command: pi
        name: Pi
        split: vertical
      - command: codex
        name: Codex
        split: horizontal

  - name: Lazygit & Hunk
    panes:
      - command: lazygit
        name: Lazygit
        focus: true
      - command: hunk diff --watch
        name: Hunk
        split: vertical

  - name: Server
    panes:
      - focus: true

mode: session

files:
  symlink:
    - frontend/node_modules # Share node_modules across worktrees (fast, no disk copy)
  copy:
    - .env.example
    - .env

post_create:
  - cd backend && python -m venv .venv && .venv/bin/pip install -r requirements.txt

windows:
  # first window
  - name: editor
  - panes:
      - command: nvim
      - name: nvim
      - focus: true
  # second window
  - name: AI
    panes:
      - command: oc
      - name: OpenCode
      - focus: true
      - command: pi
      - name: Pi
      - split: vertical
      - command: codex
      - name: Codex
      - split: horizontal
  # third window
  - name: Lazygit & Hunk
  - panes:
      - command: lazygit
      - name: Lazygit
      - focus: true
      - command: hunk diff --watch
      - name: Hunk
      - split: vertical
  # fourth window
  - name: Server
  - panes:
      - focus: true
